name = "roots"
main = "@astrojs/cloudflare/entrypoints/server"
compatibility_date = "2026-01-22"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "dist/client"
# Worker handles all routes first for dynamic routes (sitemap.xml etc.).
# Without this, Cloudflare matches static assets first and `.xml`/`.json`
# extensions fall through to 404 before reaching the worker.
run_worker_first = true
binding = "ASSETS"

[observability]
enabled = true

# 데이터 소스: TypeScript in-memory (`apps/roots/app/data/concepts/*.ts`
# 438 concepts, `fields.ts` 18 fields). D1 바인딩은 사용하지 않습니다.
