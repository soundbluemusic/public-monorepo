name: Quality Gate

on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'data/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'tsconfig*.json'
      - 'turbo.json'
      - 'biome.json'
      - 'vitest*.ts'
      - 'playwright.config.ts'
      - '.size-limit.json'
      - '.github/workflows/quality.yml'
      - 'tests/**'
  pull_request:
    branches: [main]

# 같은 workflow 중복 실행 방지 - 새 커밋 오면 이전 실행 취소
concurrency:
  group: quality-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================
  # Stage 1: 공통 셋업 (node_modules 캐시 생성)
  # ============================================================
  setup:
    name: Setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "store=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache node_modules
        uses: actions/cache@v6
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: nm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

  # ============================================================
  # Stage 2: 빠른 검증 + 빌드 (병렬 실행)
  # ============================================================
  fast-checks:
    name: Fast Checks
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Restore node_modules cache
        uses: actions/cache@v6
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: nm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      # Turborepo 로컬 캐시 복원
      - name: Restore Turbo cache
        uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            turbo-${{ runner.os }}-

      - name: TypeScript check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test with coverage
        run: pnpm test:coverage

      - name: Check circular dependencies
        run: pnpm check:circular

      - name: Check package versions
        run: pnpm check:versions

      - name: Check metadata consistency
        run: pnpm sync:stats --check

  build:
    name: Build All Apps
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Restore node_modules cache
        uses: actions/cache@v6
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: nm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      # Turborepo 로컬 캐시 복원
      - name: Restore Turbo cache
        uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            turbo-${{ runner.os }}-

      - name: Build all apps
        run: pnpm build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build-output
          path: apps/*/dist
          include-hidden-files: true
          retention-days: 1

  # ============================================================
  # Stage 3: 빌드 결과 사용하는 테스트들 (병렬 실행)
  # ============================================================

  # Job 3-1: Playwright 통합 테스트
  playwright:
    name: Playwright Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Restore node_modules cache
        uses: actions/cache@v6
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: nm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: build-output
          path: apps

      # Playwright 브라우저 캐싱
      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(pnpm exec playwright --version | head -1)" >> $GITHUB_OUTPUT

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Playwright deps (cached)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      # 프로덕션 URL로 E2E 테스트 실행 (SSR 앱은 로컬 서버 불가)
      - name: Run E2E tests against production
        run: pnpm exec playwright test --project=production-smoke
        env:
          PLAYWRIGHT_BASE_URL_CONTEXT: https://context.soundbluemusic.com
          PLAYWRIGHT_BASE_URL_PERMISSIVE: https://permissive.soundbluemusic.com
          PLAYWRIGHT_BASE_URL_ROOTS: https://roots.soundbluemusic.com

  # Job 3-2: 빌드 후 검증 (SSR + 번들 사이즈)
  post-build:
    name: Post Build Checks
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Restore node_modules cache
        uses: actions/cache@v6
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: nm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: build-output
          path: apps

      - name: Check bundle size
        run: pnpm check:size

      - name: Verify SSR build
        run: pnpm verify:ssr
