name: Deploy Roots Workers

on:
  push:
    branches: [main]
    paths:
      - 'apps/roots/**'
      - 'packages/**'
      - 'data/roots/**'
  workflow_dispatch:

concurrency:
  group: deploy-roots-workers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & Deploy Workers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Build Roots
        run: pnpm build:roots

      - name: Inject polyfill for SSR
        working-directory: apps/roots
        run: node scripts/inject-polyfill.mjs

      - name: Deploy to Cloudflare Workers
        working-directory: apps/roots
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config dist/server/wrangler.json

      - name: Purge Cloudflare CDN Cache
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          curl -X POST "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}'

      - name: Smoke test - SSR page rendering
        run: |
          echo "🔍 Testing SSR page rendering..."
          echo "⏳ Waiting 5s for deployment propagation..."
          sleep 5

          FAILED=0
          BASE_URL="https://roots.soundbluemusic.com"

          # Test 1: Homepage has SSR content
          echo ""
          echo "📄 Test 1: Homepage SSR"
          HOME_STATUS=$(curl -sL -o /tmp/roots-home.html -w "%{http_code}" "$BASE_URL/")
          if [ "$HOME_STATUS" = "200" ] && grep -q '<title>.*Roots' /tmp/roots-home.html; then
            echo "✅ Homepage has title tag"
          else
            echo "❌ Homepage missing title tag (SSR failed)"
            echo "HTTP status: $HOME_STATUS"
            FAILED=1
          fi

          # Test 2: Concept page renders
          echo ""
          echo "📄 Test 2: Concept page"
          CONCEPT_STATUS=$(curl -sL -o /tmp/roots-concept.html -w "%{http_code}" "$BASE_URL/concept/pythagorean-theorem")
          if [ "$CONCEPT_STATUS" = "200" ] && grep -qi 'pythagorean\|피타고라스' /tmp/roots-concept.html; then
            echo "✅ Concept page renders"
          else
            echo "❌ Concept page failed"
            echo "HTTP status: $CONCEPT_STATUS"
            FAILED=1
          fi

          # Test 3: Korean version works
          echo ""
          echo "📄 Test 3: Korean version"
          KO_STATUS=$(curl -sL -o /tmp/roots-ko.html -w "%{http_code}" "$BASE_URL/ko/")
          if [ "$KO_STATUS" = "200" ] && grep -q 'Roots' /tmp/roots-ko.html; then
            echo "✅ Korean version renders"
          else
            echo "❌ Korean version failed"
            echo "HTTP status: $KO_STATUS"
            FAILED=1
          fi

          # Test 4: Field page
          echo ""
          echo "📄 Test 4: Field page"
          FIELD_STATUS=$(curl -sL -o /tmp/roots-field.html -w "%{http_code}" "$BASE_URL/field/algebra")
          if [ "$FIELD_STATUS" = "200" ] && grep -qi 'algebra\|대수' /tmp/roots-field.html; then
            echo "✅ Field page renders"
          else
            echo "❌ Field page failed"
            echo "HTTP status: $FIELD_STATUS"
            FAILED=1
          fi

          if [ "$FAILED" -eq 1 ]; then
            echo ""
            echo "🚨 SMOKE TEST FAILED!"
            exit 1
          fi

          echo ""
          echo "✨ All smoke tests passed!"
