name: Production Link Check

on:
  # 매주 일요일 오전 9시 (KST) = 일요일 자정 (UTC)
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:
    inputs:
      urls:
        description: 'context, permissive, roots 또는 정확한 사이트 주소 (쉼표 구분, 비우면 전체)'
        required: false
        default: ''

concurrency:
  group: link-check-prod
  cancel-in-progress: true

jobs:
  check-links:
    name: Check all sitemap pages and their links
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: --version
          failIfEmpty: false
          jobSummary: false
      - name: Audit sitemap pages and links
        env:
          REQUESTED_SITES: ${{ inputs.urls }}
        run: pnpm check:links:prod "$REQUESTED_SITES"
      - name: Upload full evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: production-link-evidence
          path: link-reports/
          if-no-files-found: warn
