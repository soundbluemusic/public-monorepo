name: D1 Database Backup

on:
  schedule:
    # 매일 UTC 03:00 (KST 12:00)에 실행
    - cron: '0 3 * * *'
  workflow_dispatch: # 수동 실행 허용

jobs:
  backup:
    name: Backup D1 Databases
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create D1 backup config
        run: |
          cat > d1-backup.wrangler.toml <<'EOF'
          name = "d1-backup"
          compatibility_date = "2026-01-22"

          [[d1_databases]]
          binding = "CONTEXT_DB"
          database_name = "context-db"
          database_id = "55c25518-db3d-4547-8ad8-e36fc66493c8"

          [[d1_databases]]
          binding = "KNOWLEDGE_DB"
          database_name = "knowledge"
          database_id = "6f93ae7e-84ab-4d0a-9ba7-d392b2d00034"
          EOF

      - name: Export context-db
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "📦 Exporting context-db..."
          mkdir -p backups

          pnpm exec wrangler d1 export context-db \
            --config d1-backup.wrangler.toml \
            --output backups/context-db.sql \
            --remote \
            --skip-confirmation

          # 파일 크기 확인
          SIZE=$(ls -lh backups/context-db.sql | awk '{print $5}')
          echo "✅ context-db exported: $SIZE"

      - name: Export knowledge (shared DB)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "📦 Exporting knowledge db..."

          pnpm exec wrangler d1 export knowledge \
            --config d1-backup.wrangler.toml \
            --output backups/knowledge.sql \
            --remote \
            --skip-confirmation

          # 파일 크기 확인
          SIZE=$(ls -lh backups/knowledge.sql | awk '{print $5}')
          echo "✅ knowledge exported: $SIZE"

      - name: Compress backups
        run: |
          cd backups
          DATE=$(date -u '+%Y-%m-%d')
          tar -czvf "d1-backup-${DATE}.tar.gz" *.sql
          rm *.sql
          ls -lh

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: d1-backup-${{ github.run_id }}
          path: backups/*.tar.gz
          retention-days: 30

      - name: Summary
        run: |
          echo ""
          echo "✨ D1 backup completed!"
          echo "Backup date: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "Retention: 30 days"
          echo ""
          echo "To restore:"
          echo "  1. Download artifact from GitHub Actions"
          echo "  2. Extract: tar -xzvf d1-backup-*.tar.gz"
          echo "  3. Import: wrangler d1 execute DB_NAME --file=backup.sql --remote"
