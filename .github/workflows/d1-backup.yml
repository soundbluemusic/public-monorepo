name: D1 Database Backup

on:
  schedule:
    # 매일 UTC 03:00 (KST 12:00)에 실행
    - cron: '0 3 * * *'
  workflow_dispatch: # 수동 실행 허용

jobs:
  backup:
    name: Backup D1 Databases
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Preflight - validate Cloudflare D1 access
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "🔎 Validating Cloudflare D1 access (token + account + per-DB read)..."

          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID secret is empty. Set it in repository secrets."
            exit 1
          fi
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::No API token. Set CLOUDFLARE_D1_API_TOKEN (preferred) or CLOUDFLARE_API_TOKEN with Account → D1 → Read."
            exit 1
          fi

          node scripts/export-d1-sql.mjs --check \
            --database-name context-db \
            --database-id 55c25518-db3d-4547-8ad8-e36fc66493c8

          node scripts/export-d1-sql.mjs --check \
            --database-name private \
            --database-id de05bd43-f2be-41c5-8e4e-8d04fa4f4534

      - name: Export context-db
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "📦 Exporting context-db..."
          mkdir -p backups

          node scripts/export-d1-sql.mjs \
            --database-name context-db \
            --database-id 55c25518-db3d-4547-8ad8-e36fc66493c8 \
            --output "$GITHUB_WORKSPACE/backups/context-db.sql" \
            --batch-size 100

          # 파일 크기 확인
          SIZE=$(ls -lh backups/context-db.sql | awk '{print $5}')
          echo "✅ context-db exported: $SIZE"

      - name: Export private DB
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "📦 Exporting private db..."

          node scripts/export-d1-sql.mjs \
            --database-name private \
            --database-id de05bd43-f2be-41c5-8e4e-8d04fa4f4534 \
            --output "$GITHUB_WORKSPACE/backups/private.sql" \
            --batch-size 100

          # 파일 크기 확인
          SIZE=$(ls -lh backups/private.sql | awk '{print $5}')
          echo "✅ private exported: $SIZE"

      - name: Compress backups
        run: |
          cd backups
          DATE=$(date -u '+%Y-%m-%d')
          tar -czvf "d1-backup-${DATE}.tar.gz" *.sql
          rm *.sql
          ls -lh

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: d1-backup-${{ github.run_id }}
          path: backups/*.tar.gz
          retention-days: 30

      - name: Summary
        run: |
          echo ""
          echo "✨ D1 backup completed!"
          echo "Backup date: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "Retention: 30 days"
          echo ""
          echo "To restore:"
          echo "  1. Download artifact from GitHub Actions"
          echo "  2. Extract: tar -xzvf d1-backup-*.tar.gz"
          echo "  3. Import: wrangler d1 execute DB_NAME --file=backup.sql --remote"
