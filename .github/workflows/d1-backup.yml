name: D1 Database Backup

on:
  schedule:
    # 매일 UTC 03:00 (KST 12:00)에 실행
    - cron: '0 3 * * *'
  workflow_dispatch: # 수동 실행 허용

jobs:
  backup:
    name: Backup D1 Databases
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Export context-db
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "📦 Exporting context-db..."
          mkdir -p backups

          node scripts/export-d1-sql.mjs \
            --database-name context-db \
            --database-id 55c25518-db3d-4547-8ad8-e36fc66493c8 \
            --output "$GITHUB_WORKSPACE/backups/context-db.sql" \
            --batch-size 100

          # 파일 크기 확인
          SIZE=$(ls -lh backups/context-db.sql | awk '{print $5}')
          echo "✅ context-db exported: $SIZE"

      - name: Export knowledge (shared DB)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "📦 Exporting knowledge db..."

          node scripts/export-d1-sql.mjs \
            --database-name knowledge \
            --database-id 6f93ae7e-84ab-4d0a-9ba7-d392b2d00034 \
            --output "$GITHUB_WORKSPACE/backups/knowledge.sql" \
            --batch-size 100

          # 파일 크기 확인
          SIZE=$(ls -lh backups/knowledge.sql | awk '{print $5}')
          echo "✅ knowledge exported: $SIZE"

      - name: Compress backups
        run: |
          cd backups
          DATE=$(date -u '+%Y-%m-%d')
          tar -czvf "d1-backup-${DATE}.tar.gz" *.sql
          rm *.sql
          ls -lh

      - name: Upload backup artifact
        uses: actions/upload-artifact@v7
        with:
          name: d1-backup-${{ github.run_id }}
          path: backups/*.tar.gz
          retention-days: 30

      - name: Summary
        run: |
          echo ""
          echo "✨ D1 backup completed!"
          echo "Backup date: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "Retention: 30 days"
          echo ""
          echo "To restore:"
          echo "  1. Download artifact from GitHub Actions"
          echo "  2. Extract: tar -xzvf d1-backup-*.tar.gz"
          echo "  3. Import: wrangler d1 execute DB_NAME --file=backup.sql --remote"
