name: Deploy Context Workers

on:
  push:
    branches: [main]
    paths:
      - 'apps/context/**'
      - 'packages/**'
      - '.github/workflows/deploy-context.yml'
  workflow_dispatch:

concurrency:
  group: deploy-context-workers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & Deploy Workers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Build Context (SSR + D1)
        run: pnpm build:context

      - name: Deploy to Cloudflare Workers
        working-directory: apps/context
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Purge Cloudflare CDN Cache
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          curl -X POST "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}'

      - name: Verify static assets are accessible
        run: |
          BASE_URL="https://context.soundbluemusic.com"
          FAILED=0
          CSS_STATUS=000

          # A new Worker and its static assets can reach the custom domain at
          # slightly different times. Retry the HTML and referenced CSS together.
          for ATTEMPT in 1 2 3 4 5 6; do
            echo "⏳ Asset verification attempt $ATTEMPT/6..."
            HTML=$(curl --fail --silent --show-error --location "$BASE_URL/" || true)
            CSS_PATH=$(echo "$HTML" | grep -oE '/_astro/[A-Za-z0-9._-]+\.css' | head -1)
            JS_PATH=$(echo "$HTML" | grep -oE '/_astro/[A-Za-z0-9._-]+\.js' | head -1)

            if [ -n "$CSS_PATH" ]; then
              CSS_STATUS=$(curl --silent --output /dev/null --write-out '%{http_code}' "$BASE_URL$CSS_PATH")
            fi

            if [ "$CSS_STATUS" = "200" ]; then
              break
            fi

            sleep 5
          done

          echo "📦 Checking CSS: $CSS_PATH"
          echo "📦 Checking JS: $JS_PATH"

          # Check CSS
          if [ -z "$CSS_PATH" ]; then
            echo "❌ CSS file not found in HTML (expected at least one /_astro/*.css)"
            FAILED=1
          elif [ "$CSS_STATUS" != "200" ]; then
            echo "❌ CSS returned HTTP $CSS_STATUS (expected 200)"
            FAILED=1
          else
            echo "✅ CSS: HTTP 200"
          fi

          # Astro does not emit a page-level JS reference when a fully SSR page
          # has no client islands. If one is referenced, it must be accessible.
          if [ -z "$JS_PATH" ]; then
            echo "✅ No page-level JS referenced (valid for fully SSR HTML)"
          else
            JS_STATUS=$(curl --silent --output /dev/null --write-out '%{http_code}' "$BASE_URL$JS_PATH")
            if [ "$JS_STATUS" != "200" ]; then
              echo "❌ JS returned HTTP $JS_STATUS (expected 200)"
              FAILED=1
            else
              echo "✅ JS: HTTP 200"
            fi
          fi

          # Check favicon
          FAV_STATUS=$(curl -sI "https://context.soundbluemusic.com/favicon.ico" | head -1 | grep -oE '[0-9]{3}')
          if [ "$FAV_STATUS" != "200" ]; then
            echo "❌ favicon.ico returned HTTP $FAV_STATUS (expected 200)"
            FAILED=1
          else
            echo "✅ favicon.ico: HTTP 200"
          fi

          # Check manifest.json
          MANIFEST_STATUS=$(curl -sI "https://context.soundbluemusic.com/manifest.json" | head -1 | grep -oE '[0-9]{3}')
          if [ "$MANIFEST_STATUS" != "200" ]; then
            echo "❌ manifest.json returned HTTP $MANIFEST_STATUS (expected 200)"
            FAILED=1
          else
            echo "✅ manifest.json: HTTP 200"
          fi

          if [ "$FAILED" -eq 1 ]; then
            echo ""
            echo "🚨 DEPLOYMENT VERIFICATION FAILED!"
            echo "   Static assets are not accessible. UI will be broken."
            echo "   Check Astro build output and wrangler configuration."
            exit 1
          fi

          echo ""
          echo "✨ All static assets verified successfully!"

      - name: Smoke test - SSR page rendering
        run: |
          echo "🔍 Testing SSR page rendering..."
          FAILED=0
          BASE_URL="https://context.soundbluemusic.com"

          # Test 1: Homepage has SSR content (not empty div)
          echo ""
          echo "📄 Test 1: Homepage SSR"
          HOME_HTML=$(curl -sL "$BASE_URL/")
          if echo "$HOME_HTML" | grep -q '<title>Context'; then
            echo "✅ Homepage has title tag"
          else
            echo "❌ Homepage missing title tag (SSR failed)"
            FAILED=1
          fi

          # Test 2: Entry page loads from D1
          echo ""
          echo "📄 Test 2: Entry page (D1 query)"
          ENTRY_HTML=$(curl -sL "$BASE_URL/entry/annyeong")
          if echo "$ENTRY_HTML" | grep -q '안녕'; then
            echo "✅ Entry page has Korean content from D1"
          else
            echo "❌ Entry page missing Korean content (D1 query failed)"
            FAILED=1
          fi

          # Test 3: Korean version works
          echo ""
          echo "📄 Test 3: Korean version"
          KO_HTML=$(curl -sL "$BASE_URL/ko/")
          if echo "$KO_HTML" | grep -q 'Context'; then
            echo "✅ Korean version renders"
          else
            echo "❌ Korean version failed"
            FAILED=1
          fi

          # Test 4: Category page
          echo ""
          echo "📄 Test 4: Category page"
          CAT_HTML=$(curl -sL "$BASE_URL/category/greetings")
          if echo "$CAT_HTML" | grep -q 'greetings\|인사\|Greetings'; then
            echo "✅ Category page renders"
          else
            echo "❌ Category page failed"
            FAILED=1
          fi

          # Test 5: Check for hydration error markers
          echo ""
          echo "📄 Test 5: No hydration errors in HTML"
          if echo "$HOME_HTML" | grep -qi 'hydration\|mismatch'; then
            echo "⚠️ Warning: Possible hydration issue detected"
          else
            echo "✅ No hydration error markers"
          fi

          if [ "$FAILED" -eq 1 ]; then
            echo ""
            echo "🚨 SMOKE TEST FAILED!"
            echo "   SSR pages are not rendering correctly."
            exit 1
          fi

          echo ""
          echo "✨ All smoke tests passed!"
