name: Deploy Permissive Workers

on:
  push:
    branches: [main]
    paths:
      - 'apps/permissive/**'
      - 'packages/**'
      - 'data/permissive/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/deploy-permissive.yml'
  workflow_dispatch:

concurrency:
  group: deploy-permissive-workers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & Deploy Workers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Build Permissive
        run: pnpm build:permissive

      - name: Deploy to Cloudflare Workers
        working-directory: apps/permissive
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Purge Cloudflare CDN Cache
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          curl -X POST "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}'

      - name: Smoke test - SSR page rendering
        run: |
          echo "🔍 Testing SSR page rendering..."
          echo "⏳ Waiting 5s for deployment propagation..."
          sleep 5

          FAILED=0
          BASE_URL="https://permissive.soundbluemusic.com"

          # Test 1: Homepage has SSR content
          echo ""
          echo "📄 Test 1: Homepage SSR"
          HOME_STATUS=$(curl -sL -o /tmp/permissive-home.html -w "%{http_code}" "$BASE_URL/")
          if [ "$HOME_STATUS" = "200" ] && grep -q '<title>.*Permissive' /tmp/permissive-home.html; then
            echo "✅ Homepage has title tag"
          else
            echo "❌ Homepage missing title tag (SSR failed)"
            echo "HTTP status: $HOME_STATUS"
            FAILED=1
          fi

          # Test 2: Library page renders
          echo ""
          echo "📄 Test 2: Library page"
          LIB_STATUS=$(curl -sL -o /tmp/permissive-library.html -w "%{http_code}" "$BASE_URL/library/react")
          if [ "$LIB_STATUS" = "200" ] && grep -qi 'react' /tmp/permissive-library.html; then
            echo "✅ Library page renders"
          else
            echo "❌ Library page failed"
            echo "HTTP status: $LIB_STATUS"
            FAILED=1
          fi

          # Test 3: Korean version works
          echo ""
          echo "📄 Test 3: Korean version"
          KO_STATUS=$(curl -sL -o /tmp/permissive-ko.html -w "%{http_code}" "$BASE_URL/ko/")
          if [ "$KO_STATUS" = "200" ] && grep -q 'Permissive' /tmp/permissive-ko.html; then
            echo "✅ Korean version renders"
          else
            echo "❌ Korean version failed"
            echo "HTTP status: $KO_STATUS"
            FAILED=1
          fi

          # Test 4: Web API page
          echo ""
          echo "📄 Test 4: Web API page"
          API_STATUS=$(curl -sL -o /tmp/permissive-api.html -w "%{http_code}" "$BASE_URL/web-api/fetch-api")
          if [ "$API_STATUS" = "200" ] && grep -qi 'fetch' /tmp/permissive-api.html; then
            echo "✅ Web API page renders"
          else
            echo "❌ Web API page failed"
            echo "HTTP status: $API_STATUS"
            FAILED=1
          fi

          if [ "$FAILED" -eq 1 ]; then
            echo ""
            echo "🚨 SMOKE TEST FAILED!"
            exit 1
          fi

          echo ""
          echo "✨ All smoke tests passed!"
