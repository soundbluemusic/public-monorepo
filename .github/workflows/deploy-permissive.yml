name: Deploy Permissive Workers

on:
  push:
    branches: [main]
    paths:
      - 'apps/permissive/**'
      - 'packages/**'
      - 'data/permissive/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'scripts/smoke-worker.sh'
      - '.github/workflows/deploy-permissive.yml'
  workflow_dispatch:

concurrency:
  group: deploy-permissive-workers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & Deploy Workers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Build Permissive
        run: pnpm build:permissive

      - name: Deploy to Cloudflare Workers
        working-directory: apps/permissive
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Purge Cloudflare CDN Cache
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          curl -X POST "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}'

      - name: Smoke test - SSR page rendering
        run: >-
          ./scripts/smoke-worker.sh
          https://permissive.soundbluemusic.com
          '<title>.*Permissive'
          /library/react 'react'
          /ko/ 'Permissive'
          /web-api/fetch-api 'fetch'
